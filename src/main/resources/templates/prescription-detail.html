<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prescription - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <style>
      /* Print rules: hide the app chrome, show only the prescription document */
      @media print {
        .no-print {
          display: none !important;
        }
        .card {
          border: none !important;
          box-shadow: none !important;
        }
        body {
          background: white !important;
        }
      }
      .rx-signature {
        border-top: 1px solid #999;
        display: inline-block;
        padding-top: 4px;
        min-width: 220px;
      }
    </style>
  </head>
  <body class="bg-light">
    <!-- Navbar depends on who's viewing (patient vs doctor) -->
    <div class="no-print">
      <div th:if="${viewerRole == 'PATIENT'}">
        <div th:replace="~{fragments/navbar :: nav('prescriptions')}"></div>
      </div>
      <div th:if="${viewerRole == 'DOCTOR'}">
        <div th:replace="~{fragments/doctornav :: nav('appointments')}"></div>
      </div>
    </div>

    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-lg-9">
          <!-- The printable prescription document -->
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <!-- Letterhead -->
              <div
                class="d-flex justify-content-between align-items-start mb-3"
              >
                <div>
                  <h4 class="mb-0">🏥 Hospital System</h4>
                  <small class="text-muted"
                    >Appointment &amp; Patient Record System</small
                  >
                </div>
                <div class="text-end">
                  <div>
                    <strong
                      th:text="${#temporals.format(rx.appointment.appointmentDate, 'dd MMM yyyy')}"
                    ></strong>
                  </div>
                  <small
                    class="text-muted"
                    th:text="'Issued ' + ${#temporals.format(rx.createdAt, 'dd MMM yyyy, HH:mm')}"
                  ></small>
                </div>
              </div>

              <hr />

              <!-- Parties -->
              <div class="row mb-3">
                <div class="col-md-6">
                  <strong>Doctor</strong><br />
                  <span th:text="${rx.appointment.doctor.user.fullName}"></span
                  ><br />
                  <small
                    class="text-muted"
                    th:text="${rx.appointment.doctor.specialization} + ' · ' + ${rx.appointment.doctor.department.name}"
                  ></small>
                </div>
                <div class="col-md-6 text-md-end">
                  <strong>Patient</strong><br />
                  <span th:text="${rx.appointment.patient.fullName}"></span
                  ><br />
                  <small class="text-muted">
                    📱 <span th:text="${rx.appointment.patient.phone}"></span>
                  </small>
                </div>
              </div>

              <!-- Diagnosis -->
              <div class="mb-3">
                <strong>Diagnosis</strong>
                <p class="mb-0" th:text="${rx.diagnosis}"></p>
              </div>

              <!-- Medicines table -->
              <div class="mb-3">
                <strong>Rx — Medicines</strong>
                <table class="table table-bordered table-sm mt-1">
                  <thead>
                    <tr>
                      <th style="width: 5%">#</th>
                      <th>Medicine</th>
                      <th>Dosage</th>
                      <th>Duration</th>
                      <th>Instructions</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="m, i : ${rx.medicines}">
                      <td th:text="${i.count}"></td>
                      <td th:text="${m.medicineName}"></td>
                      <td th:text="${m.dosage ?: '-'}"></td>
                      <td th:text="${m.duration ?: '-'}"></td>
                      <td th:text="${m.instructions ?: '-'}"></td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <!-- Notes -->
              <div class="mb-4" th:if="${rx.notes}">
                <strong>Notes / Advice</strong>
                <p class="mb-0" th:text="${rx.notes}"></p>
              </div>

              <!-- Signature line (only meaningful on the printed copy) -->
              <div class="text-end mt-5">
                <div class="rx-signature">
                  <span th:text="${rx.appointment.doctor.user.fullName}"></span>
                </div>
                <small class="text-muted d-block mt-1">Signature</small>
              </div>
            </div>
          </div>

          <!-- Action buttons (screen only, hidden when printing) -->
          <div class="d-flex gap-2 mt-3 no-print">
            <button onclick="window.print()" class="btn btn-primary">
              🖨️ Print / Save PDF
            </button>
            <a
              th:if="${viewerRole == 'DOCTOR'}"
              class="btn btn-outline-warning"
              th:href="@{/doctor/prescribe/edit(prescriptionId=${rx.id})}"
              >✏️ Edit Prescription</a
            >
            <a
              th:if="${viewerRole == 'PATIENT'}"
              th:href="@{/patient/prescriptions}"
              class="btn btn-outline-secondary"
              >← Back to My Prescriptions</a
            >
            <a
              th:if="${viewerRole == 'DOCTOR'}"
              th:href="@{/doctor/appointments}"
              class="btn btn-outline-secondary"
              >← Back to Appointments</a
            >
          </div>
        </div>
      </div>
    </div>

    <div class="no-print" th:replace="~{fragments/navbar :: scripts}"></div>
  </body>
</html>
