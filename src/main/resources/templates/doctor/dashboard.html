<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Dashboard - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/doctornav :: nav('dashboard')}"></div>

    <div class="container mt-4">
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h4>Welcome, <span th:text="${doctor.user.fullName}"></span> 🩺</h4>
          <p class="text-muted mb-0">
            <span th:text="${doctor.specialization}"></span> ·
            <span th:text="${doctor.department.name}"></span>
          </p>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="card text-bg-primary shadow-sm">
            <div class="card-body">
              <h6 class="card-title">Today's Appointments</h6>
              <h2 class="mb-0" th:text="${todayCount}">0</h2>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card text-bg-warning shadow-sm">
            <div class="card-body">
              <h6 class="card-title">Pending Requests</h6>
              <h2 class="mb-0" th:text="${pendingCount}">0</h2>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card text-bg-success shadow-sm">
            <div class="card-body">
              <h6 class="card-title">Completed Today</h6>
              <h2 class="mb-0" th:text="${completedTodayCount}">0</h2>
            </div>
          </div>
        </div>
      </div>

      <!-- Pending requests (any date) -->
      <h5>Pending Requests</h5>
      <div
        class="alert alert-secondary py-2"
        th:if="${#lists.isEmpty(pending)}"
      >
        No pending appointment requests.
      </div>
      <div class="card shadow-sm mb-4" th:if="${!#lists.isEmpty(pending)}">
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Patient</th>
                <th>Phone</th>
                <th>Reason</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="a : ${pending}">
                <td
                  th:text="${#temporals.format(a.appointmentDate, 'dd MMM yyyy')}"
                ></td>
                <td th:text="${#temporals.format(a.startTime, 'HH:mm')}"></td>
                <td th:text="${a.patient.fullName}"></td>
                <td class="text-muted small" th:text="${a.patient.phone}"></td>
                <td class="small" th:text="${a.reason}"></td>
                <td>
                  <form
                    th:action="@{/doctor/appointments/confirm}"
                    method="post"
                    class="d-inline"
                  >
                    <input type="hidden" name="id" th:value="${a.id}" />
                    <button class="btn btn-success btn-sm">Confirm</button>
                  </form>
                  <form
                    th:action="@{/doctor/appointments/reject}"
                    method="post"
                    class="d-inline"
                    onsubmit="return confirm('Reject this appointment?');"
                  >
                    <input type="hidden" name="id" th:value="${a.id}" />
                    <button class="btn btn-outline-danger btn-sm">
                      Reject
                    </button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Today's schedule -->
      <h5>
        Today's Schedule —
        <span th:text="${#temporals.format(today, 'dd MMM yyyy')}"></span>
      </h5>
      <div class="alert alert-secondary py-2" th:if="${#lists.isEmpty(todays)}">
        No appointments today.
      </div>
      <div class="card shadow-sm" th:if="${!#lists.isEmpty(todays)}">
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th>Time</th>
                <th>Patient</th>
                <th>Phone</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="a : ${todays}">
                <td th:text="${#temporals.format(a.startTime, 'HH:mm')}"></td>
                <td th:text="${a.patient.fullName}"></td>
                <td class="text-muted small" th:text="${a.patient.phone}"></td>
                <td>
                  <span th:switch="${a.status.name()}">
                    <span
                      class="badge text-bg-warning"
                      th:case="PENDING"
                      th:text="${a.status}"
                    ></span>
                    <span
                      class="badge text-bg-primary"
                      th:case="CONFIRMED"
                      th:text="${a.status}"
                    ></span>
                    <span
                      class="badge text-bg-secondary"
                      th:case="COMPLETED"
                      th:text="${a.status}"
                    ></span>
                    <span
                      class="badge text-bg-danger"
                      th:case="CANCELLED"
                      th:text="${a.status}"
                    ></span>
                  </span>
                </td>
                <td>
                  <form
                    th:if="${a.status.name() == 'CONFIRMED'}"
                    th:action="@{/doctor/appointments/complete}"
                    method="post"
                    class="d-inline"
                  >
                    <input type="hidden" name="id" th:value="${a.id}" />
                    <button class="btn btn-primary btn-sm">
                      Complete Consultation
                    </button>
                  </form>
                  <a
                    th:if="${a.status.name() == 'COMPLETED' and rxMap[a.id] != null}"
                    class="btn btn-outline-primary btn-sm"
                    th:href="@{/doctor/prescriptions/{id}(id=${rxMap[a.id]})}"
                    >View Rx</a
                  >
                  <a
                    th:if="${a.status.name() == 'COMPLETED' and rxMap[a.id] == null}"
                    class="btn btn-warning btn-sm"
                    th:href="@{/doctor/prescribe(appointmentId=${a.id})}"
                    >✍️ Write Rx</a
                  >
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
  </body>
</html>
