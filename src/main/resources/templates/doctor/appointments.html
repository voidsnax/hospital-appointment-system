<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Appointments - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/doctornav :: nav('appointments')}"></div>

    <div class="container mt-4">
      <h3 class="mb-3">All Appointments</h3>

      <div
        class="alert alert-success"
        th:if="${success}"
        th:text="${success}"
      ></div>
      <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Patient</th>
                <th>Phone</th>
                <th>Status</th>
                <th>Reason</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="a : ${appointments}">
                <td
                  th:text="${#temporals.format(a.appointmentDate, 'dd MMM yyyy')}"
                ></td>
                <td th:text="${#temporals.format(a.startTime, 'HH:mm')}"></td>
                <td th:text="${a.patient.fullName}"></td>
                <td class="text-muted small" th:text="${a.patient.phone}"></td>
                <td>
                  <span th:switch="${a.status.name()}">
                    <span
                      class="badge text-bg-warning"
                      th:case="PENDING"
                      th:text="${a.status}"
                    ></span>
                    <span
                      class="badge text-bg-primary"
                      th:case="CONFIRMED"
                      th:text="${a.status}"
                    ></span>
                    <span
                      class="badge text-bg-secondary"
                      th:case="COMPLETED"
                      th:text="${a.status}"
                    ></span>
                    <span
                      class="badge text-bg-danger"
                      th:case="CANCELLED"
                      th:text="${a.status}"
                    ></span>
                  </span>
                </td>
                <td class="small" th:text="${a.reason}"></td>
                <td>
                  <span th:if="${a.status.name() == 'PENDING'}">
                    <form
                      th:action="@{/doctor/appointments/confirm}"
                      method="post"
                      class="d-inline"
                    >
                      <input type="hidden" name="id" th:value="${a.id}" />
                      <button class="btn btn-success btn-sm">Confirm</button>
                    </form>
                    <form
                      th:action="@{/doctor/appointments/reject}"
                      method="post"
                      class="d-inline"
                      onsubmit="return confirm('Reject this appointment?');"
                    >
                      <input type="hidden" name="id" th:value="${a.id}" />
                      <button class="btn btn-outline-danger btn-sm">
                        Reject
                      </button>
                    </form>
                  </span>
                  <form
                    th:if="${a.status.name() == 'CONFIRMED'}"
                    th:action="@{/doctor/appointments/complete}"
                    method="post"
                    class="d-inline"
                  >
                    <input type="hidden" name="id" th:value="${a.id}" />
                    <button class="btn btn-primary btn-sm">Complete</button>
                  </form>
                  <a
                    th:if="${a.status.name() == 'COMPLETED' and rxMap[a.id] != null}"
                    class="btn btn-outline-primary btn-sm"
                    th:href="@{/doctor/prescriptions/{id}(id=${rxMap[a.id]})}"
                    >View Rx</a
                  >
                  <a
                    th:if="${a.status.name() == 'COMPLETED' and rxMap[a.id] == null}"
                    class="btn btn-warning btn-sm"
                    th:href="@{/doctor/prescribe(appointmentId=${a.id})}"
                    >✍️ Write Rx</a
                  >
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(appointments)}">
                <td colspan="7" class="text-center text-muted py-4">
                  No appointments yet.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
  </body>
</html>
