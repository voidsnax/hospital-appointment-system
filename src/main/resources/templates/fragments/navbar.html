<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-primary"
      th:fragment="nav(active)"
    >
      <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/patient/dashboard}"
          >🏥 Hospital System</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a
                class="nav-link"
                th:classappend="${active=='dashboard'}?'active':''"
                th:href="@{/patient/dashboard}"
                >Dashboard</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                th:classappend="${active=='doctors'}?'active':''"
                th:href="@{/patient/doctors}"
                >Book Appointment</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                th:classappend="${active=='appointments'}?'active':''"
                th:href="@{/patient/appointments}"
                >My Appointments</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                th:classappend="${active=='prescriptions'}?'active':''"
                th:href="@{/patient/prescriptions}"
                >My Prescriptions</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                th:classappend="${active=='profile'}?'active':''"
                th:href="@{/patient/profile}"
                >My Profile</a
              >
            </li>
          </ul>
          <div class="d-flex align-items-center">
            <span class="navbar-text me-3">
              <span
                class="badge rounded-pill fs-6 fw-normal py-2 px-3"
                sec:authentication="name"
              ></span>
            </span>
            <form th:action="@{/logout}" method="post">
              <button type="submit" class="btn btn-light btn-sm">Logout</button>
            </form>
          </div>
        </div>
      </div>
    </nav>

    <div th:fragment="scripts">
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </div>
  </body>
</html>
