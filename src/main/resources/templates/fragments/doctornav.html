<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-primary"
      th:fragment="nav(active)"
    >
      <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/doctor/dashboard}"
          >🏥 Hospital System</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#doctorNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="doctorNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a
                class="nav-link"
                th:classappend="${active=='dashboard'}?'active':''"
                th:href="@{/doctor/dashboard}"
                >Dashboard</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                th:classappend="${active=='appointments'}?'active':''"
                th:href="@{/doctor/appointments}"
                >All Appointments</a
              >
            </li>
          </ul>
          <div class="d-flex align-items-center">
            <span class="navbar-text me-3" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post">
              <button type="submit" class="btn btn-light btn-sm">Logout</button>
            </form>
          </div>
        </div>
      </div>
    </nav>
  </body>
</html>
