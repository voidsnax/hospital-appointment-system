<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Appointments - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav('appointments')}"></div>

    <div class="container mt-4">
      <h3 class="mb-3">My Appointments</h3>

      <div
        class="alert alert-success"
        th:if="${success}"
        th:text="${success}"
      ></div>
      <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Doctor</th>
                <th>Status</th>
                <th>Fee</th>
                <th>Reason</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="a : ${appointments}">
                <td
                  th:text="${#temporals.format(a.appointmentDate, 'dd MMM yyyy')}"
                ></td>
                <td th:text="${#temporals.format(a.startTime, 'HH:mm')}"></td>
                <td th:text="${a.doctor.user.fullName}"></td>
                <td>
                  <span th:switch="${a.status.name()}">
                    <span
                      class="badge text-bg-warning"
                      th:case="PENDING"
                      th:text="${a.status}"
                    ></span>
                    <span
                      class="badge text-bg-primary"
                      th:case="CONFIRMED"
                      th:text="${a.status}"
                    ></span>
                    <span
                      class="badge text-bg-secondary"
                      th:case="COMPLETED"
                      th:text="${a.status}"
                    ></span>
                    <span
                      class="badge text-bg-danger"
                      th:case="CANCELLED"
                      th:text="${a.status}"
                    ></span>
                  </span>
                </td>
                <td th:text="'₹' + ${a.fee}"></td>
                <td class="small" th:text="${a.reason}"></td>
                <td>
                  <a
                    th:if="${a.status.name() == 'COMPLETED' and rxIdMap[a.id] != null}"
                    class="btn btn-outline-info btn-sm d-block mb-1"
                    th:href="@{/patient/prescriptions/{id}(id=${rxIdMap[a.id]})}"
                    >💊 View Rx</a
                  >
                  <form
                    th:action="@{/patient/appointments/cancel}"
                    method="post"
                    onsubmit="return confirm('Cancel this appointment?');"
                    th:if="${a.status.name() == 'PENDING' or a.status.name() == 'CONFIRMED'}"
                  >
                    <input type="hidden" name="id" th:value="${a.id}" />
                    <button type="submit" class="btn btn-outline-danger btn-sm">
                      Cancel
                    </button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(appointments)}">
                <td colspan="7" class="text-center text-muted py-4">
                  No appointments yet.
                  <a th:href="@{/patient/doctors}"
                    >Book your first appointment</a
                  >.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
  </body>
</html>
