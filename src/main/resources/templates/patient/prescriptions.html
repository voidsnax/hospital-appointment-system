<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Prescriptions - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav('prescriptions')}"></div>

    <div class="container mt-4">
      <h3 class="mb-3">My Prescriptions</h3>

      <div class="alert alert-info" th:if="${#lists.isEmpty(prescriptions)}">
        No prescriptions yet. They appear here after a doctor completes your
        consultation.
      </div>

      <a
        class="card shadow-sm mb-3 text-decoration-none d-block"
        th:each="rx : ${prescriptions}"
        th:href="@{/patient/prescriptions/{id}(id=${rx.id})}"
      >
        <div class="card-body">
          <div class="d-flex justify-content-between flex-wrap">
            <div>
              <h5 class="mb-1" th:text="${rx.appointment.doctor.user.fullName}">
                Dr. Name
              </h5>
              <p
                class="text-muted mb-1"
                th:text="${rx.appointment.doctor.specialization}"
              ></p>
            </div>
            <div class="text-end">
              <span
                >📅
                <span
                  th:text="${#temporals.format(rx.appointment.appointmentDate, 'dd MMM yyyy')}"
                ></span></span
              ><br />
              <small
                class="text-muted"
                th:text="'Issued ' + ${#temporals.format(rx.createdAt, 'dd MMM yyyy, HH:mm')}"
              ></small>
            </div>
          </div>

          <hr />
          <p class="mb-1">
            <strong>Diagnosis:</strong> <span th:text="${rx.diagnosis}"></span>
          </p>
          <p class="mb-3" th:if="${rx.notes}">
            <strong>Notes:</strong> <span th:text="${rx.notes}"></span>
          </p>

          <table class="table table-sm table-bordered mb-0">
            <thead class="table-light">
              <tr>
                <th>Medicine</th>
                <th>Dosage</th>
                <th>Duration</th>
                <th>Instructions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="m : ${rx.medicines}">
                <td th:text="${m.medicineName}"></td>
                <td th:text="${m.dosage ?: '-'}"></td>
                <td th:text="${m.duration ?: '-'}"></td>
                <td th:text="${m.instructions ?: '-'}"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </a>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
  </body>
</html>
