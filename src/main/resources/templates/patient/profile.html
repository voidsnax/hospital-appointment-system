<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav('profile')}"></div>

    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <h3 class="mb-3">My Profile</h3>

          <div
            class="alert alert-success"
            th:if="${success}"
            th:text="${success}"
          ></div>

          <div class="card shadow-sm">
            <div class="card-body">
              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">Full Name</label>
                  <input
                    type="text"
                    class="form-control"
                    th:value="${profile.user.fullName}"
                    disabled
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    th:value="${profile.user.email}"
                    disabled
                  />
                </div>
              </div>

              <form th:action="@{/patient/profile}" method="post">
                <div class="row">
                  <div class="col-md-4 mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input
                      type="date"
                      class="form-control"
                      name="dateOfBirth"
                      th:value="${profile.dateOfBirth}"
                    />
                  </div>
                  <div class="col-md-4 mb-3">
                    <label class="form-label">Gender</label>
                    <select class="form-select" name="gender">
                      <option value="">-- Select --</option>
                      <option
                        th:each="g : ${T(com.hospital.app.entity.Gender).values()}"
                        th:value="${g}"
                        th:text="${g}"
                        th:selected="${profile.gender == g}"
                      ></option>
                    </select>
                  </div>
                  <div class="col-md-4 mb-3">
                    <label class="form-label">Blood Group</label>
                    <select class="form-select" name="bloodGroup">
                      <option value="">-- Select --</option>
                      <option
                        th:each="bg : ${ {'A+','A-','B+','B-','AB+','AB-','O+','O-'} }"
                        th:value="${bg}"
                        th:text="${bg}"
                        th:selected="${profile.bloodGroup == bg}"
                      ></option>
                    </select>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Address</label>
                  <textarea
                    class="form-control"
                    name="address"
                    rows="2"
                    th:text="${profile.address}"
                  ></textarea>
                </div>

                <div class="mb-3">
                  <label class="form-label">Emergency Contact (phone)</label>
                  <input
                    type="text"
                    class="form-control"
                    name="emergencyContact"
                    th:value="${profile.emergencyContact}"
                    placeholder="9876543210"
                  />
                </div>

                <button type="submit" class="btn btn-primary">
                  Save Profile
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
  </body>
</html>
