<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav('dashboard')}"></div>

    <div class="container mt-4">
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h4>Welcome, <span th:text="${user.fullName}"></span> 👋</h4>
          <p class="text-muted mb-0">
            Total appointments so far:
            <strong th:text="${totalAppointments}"></strong>
          </p>
        </div>
      </div>

      <div class="d-flex gap-2 mb-4 flex-wrap">
        <a th:href="@{/patient/doctors}" class="btn btn-primary"
          >＋ Book Appointment</a
        >
        <a th:href="@{/patient/appointments}" class="btn btn-outline-primary"
          >My Appointments</a
        >
        <a th:href="@{/patient/prescriptions}" class="btn btn-outline-secondary"
          >My Prescriptions</a
        >
      </div>

      <h5>Upcoming Appointments</h5>
      <div class="alert alert-info" th:if="${#lists.isEmpty(upcoming)}">
        You have no upcoming appointments.
      </div>

      <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="a : ${upcoming}">
          <div class="card shadow-sm">
            <div class="card-body">
              <h6
                class="card-title mb-1"
                th:text="${a.doctor.user.fullName}"
              ></h6>
              <p
                class="mb-1 text-muted"
                th:text="${a.doctor.specialization}"
              ></p>
              <p class="mb-2">
                📅
                <span
                  th:text="${#temporals.format(a.appointmentDate, 'dd MMM yyyy')}"
                ></span>
                &nbsp;⏰
                <span
                  th:text="${#temporals.format(a.startTime, 'HH:mm')}"
                ></span>
              </p>
              <span th:switch="${a.status.name()}">
                <span
                  class="badge text-bg-warning"
                  th:case="PENDING"
                  th:text="${a.status}"
                ></span>
                <span
                  class="badge text-bg-primary"
                  th:case="CONFIRMED"
                  th:text="${a.status}"
                ></span>
              </span>
            </div>
          </div>
        </div>
      </div>
      <h5 class="mt-4">Recent Prescriptions</h5>
      <div class="alert alert-info" th:if="${#lists.isEmpty(prescriptions)}">
        No prescriptions yet — they appear after a doctor completes your
        consultation.
      </div>
      <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="rx : ${prescriptions}">
          <a
            class="card shadow-sm text-decoration-none h-100"
            th:href="@{/patient/prescriptions/{id}(id=${rx.id})}"
          >
            <div class="card-body">
              <h6
                class="card-title mb-1"
                th:text="${rx.appointment.doctor.user.fullName}"
              ></h6>
              <p class="mb-1 text-muted small" th:text="${rx.diagnosis}"></p>
              <small
                class="text-muted"
                th:text="'📅 ' + ${#temporals.format(rx.appointment.appointmentDate, 'dd MMM yyyy')}"
              ></small>
            </div>
          </a>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
  </body>
</html>
