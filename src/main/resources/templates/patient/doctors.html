<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctors - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: nav('doctors')}"></div>

    <div class="container mt-4">
      <h3 class="mb-3">Find a Doctor</h3>

      <div class="btn-group flex-wrap mb-4">
        <a
          class="btn btn-sm"
          th:classappend="${selectedDepartment == null}?'btn-primary':'btn-outline-primary'"
          th:href="@{/patient/doctors}"
          >All</a
        >
        <a
          class="btn btn-sm"
          th:each="d : ${departments}"
          th:classappend="${selectedDepartment == d.id}?'btn-primary':'btn-outline-primary'"
          th:href="@{/patient/doctors(department=${d.id})}"
          th:text="${d.name}"
          >Dept</a
        >
      </div>

      <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="doc : ${doctors}">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title mb-1" th:text="${doc.user.fullName}">
                Dr. Name
              </h5>
              <p class="text-muted mb-1">
                <span th:text="${doc.specialization}"></span> ·
                <span th:text="${doc.department.name}"></span>
              </p>
              <p class="mb-1 small" th:text="${doc.qualification}">
                Qualification
              </p>
              <p class="mb-3">
                Consultation fee:
                <strong>₹<span th:text="${doc.consultationFee}"></span></strong>
              </p>
              <a
                class="btn btn-primary btn-sm"
                th:href="@{/patient/book(doctorId=${doc.id})}"
              >
                Book Appointment
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
  </body>
</html>
