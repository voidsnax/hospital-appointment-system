<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctors - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/adminnav :: nav('doctors')}"></div>

    <div class="container mt-4">
      <div
        class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2"
      >
        <h3 class="mb-0">Doctors</h3>
        <a th:href="@{/admin/doctors/add}" class="btn btn-primary"
          >+ Add Doctor</a
        >
      </div>

      <div
        class="alert alert-success"
        th:if="${success}"
        th:text="${success}"
      ></div>
      <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Specialization</th>
                <th>Fee</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="doc : ${doctors}">
                <td th:text="${doc.user.fullName}"></td>
                <td class="small text-muted" th:text="${doc.user.email}"></td>
                <td th:text="${doc.department.name}"></td>
                <td th:text="${doc.specialization}"></td>
                <td th:text="'₹' + ${doc.consultationFee}"></td>
                <td>
                  <a
                    class="btn btn-sm btn-outline-primary"
                    th:href="@{/admin/doctors/edit(id=${doc.id})}"
                    >Edit</a
                  >
                  <a
                    class="btn btn-sm btn-outline-secondary"
                    th:href="@{/admin/schedules(doctorId=${doc.id})}"
                    >Schedule</a
                  >
                  <form
                    th:action="@{/admin/doctors/delete}"
                    method="post"
                    class="d-inline"
                    onsubmit="
                      return confirm(
                        'Delete this doctor? This cannot be undone.',
                      );
                    "
                  >
                    <input type="hidden" name="id" th:value="${doc.id}" />
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                      Delete
                    </button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
  </body>
</html>
