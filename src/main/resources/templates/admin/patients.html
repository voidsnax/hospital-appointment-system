<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patients - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/adminnav :: nav('patients')}"></div>

    <div class="container mt-4">
      <h3 class="mb-3">Patients</h3>

      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Registered</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${patients}">
                <td th:text="${p.fullName}"></td>
                <td class="small text-muted" th:text="${p.email}"></td>
                <td th:text="${p.phone}"></td>
                <td
                  th:text="${#temporals.format(p.createdAt, 'dd MMM yyyy')}"
                ></td>
                <td>
                  <a
                    class="btn btn-sm btn-outline-primary"
                    th:href="@{/admin/patients/view(id=${p.id})}"
                    >View Record</a
                  >
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(patients)}">
                <td colspan="5" class="text-center text-muted py-4">
                  No patients registered yet.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
  </body>
</html>
