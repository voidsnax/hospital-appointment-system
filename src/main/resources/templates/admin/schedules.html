<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/adminnav :: nav('doctors')}"></div>

    <div class="container mt-4">
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h4 class="mb-1" th:text="${doctor.user.fullName}"></h4>
          <p class="text-muted mb-0">
            <span th:text="${doctor.specialization}"></span> ·
            <span th:text="${doctor.department.name}"></span>
          </p>
        </div>
      </div>

      <div
        class="alert alert-success"
        th:if="${success}"
        th:text="${success}"
      ></div>
      <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

      <div class="card shadow-sm mb-4">
        <div class="card-header">Add Availability</div>
        <div class="card-body">
          <form
            th:action="@{/admin/schedules/add}"
            method="post"
            class="row g-2 align-items-end"
          >
            <input type="hidden" name="doctorId" th:value="${doctor.id}" />
            <div class="col-md-3">
              <label class="form-label">Day</label>
              <select class="form-select" name="dayOfWeek" required>
                <option
                  th:each="day : ${T(java.time.DayOfWeek).values()}"
                  th:value="${day}"
                  th:text="${day}"
                ></option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label">Start</label>
              <input
                type="time"
                class="form-control"
                name="startTime"
                required
              />
            </div>
            <div class="col-md-2">
              <label class="form-label">End</label>
              <input type="time" class="form-control" name="endTime" required />
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-primary w-100">Add</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-header">Current Schedule</div>
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th>Day</th>
                <th>Start</th>
                <th>End</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="s : ${schedules}">
                <td th:text="${s.dayOfWeek}"></td>
                <td th:text="${#temporals.format(s.startTime, 'HH:mm')}"></td>
                <td th:text="${#temporals.format(s.endTime, 'HH:mm')}"></td>
                <td>
                  <form
                    th:action="@{/admin/schedules/delete}"
                    method="post"
                    onsubmit="return confirm('Remove this schedule entry?');"
                  >
                    <input type="hidden" name="id" th:value="${s.id}" />
                    <input
                      type="hidden"
                      name="doctorId"
                      th:value="${doctor.id}"
                    />
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                      Remove
                    </button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(schedules)}">
                <td colspan="4" class="text-center text-muted py-3">
                  No schedule entries — this doctor currently has no bookable
                  slots.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <a th:href="@{/admin/doctors}" class="btn btn-outline-secondary mt-3"
        >← Back to Doctors</a
      >
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
  </body>
</html>
