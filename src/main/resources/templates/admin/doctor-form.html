<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Form - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/adminnav :: nav('doctors')}"></div>

    <div class="container mt-4">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <h3 th:text="${doctor == null} ? 'Add Doctor' : 'Edit Doctor'"></h3>

          <div class="card shadow-sm">
            <div class="card-body">
              <form th:action="@{${formAction}}" method="post">
                <input
                  type="hidden"
                  name="id"
                  th:if="${doctor != null}"
                  th:value="${doctor.id}"
                />

                <!-- Account section: both modes; password only when adding -->
                <h6 class="text-muted">Login Account</h6>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Full Name</label>
                    <input
                      type="text"
                      class="form-control"
                      name="fullName"
                      required
                      maxlength="100"
                      th:value="${doctor != null} ? ${doctor.user.fullName} : ''"
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Email (login username)</label>
                    <input
                      type="email"
                      class="form-control"
                      name="email"
                      required
                      maxlength="150"
                      th:value="${doctor != null} ? ${doctor.user.email} : ''"
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Phone</label>
                    <input
                      type="text"
                      class="form-control"
                      name="phone"
                      required
                      maxlength="15"
                      th:value="${doctor != null} ? ${doctor.user.phone} : ''"
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Password (min 8 chars)</label>
                    <div class="input-group">
                      <input
                        type="password"
                        class="form-control"
                        name="password"
                        id="doctorPassword"
                        required
                        minlength="8"
                      />
                      <button
                        class="btn btn-outline-secondary"
                        type="button"
                        onclick="togglePassword()"
                      >
                        👁
                      </button>
                    </div>
                  </div>
                </div>
                <p class="text-muted small mb-3" th:if="${doctor != null}">
                  Changing the email changes this doctor's login username.
                  Passwords are reset via the "Forgot password" link on the
                  login page.
                </p>

                <!-- Professional details: BOTH modes -->
                <h6 class="text-muted">Professional Details</h6>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Department</label>
                    <select class="form-select" name="departmentId" required>
                      <option
                        th:each="d : ${departments}"
                        th:value="${d.id}"
                        th:text="${d.name}"
                        th:selected="${doctor != null and doctor.department.id == d.id}"
                      ></option>
                    </select>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Specialization</label>
                    <input
                      type="text"
                      class="form-control"
                      name="specialization"
                      required
                      maxlength="100"
                      th:value="${doctor != null} ? ${doctor.specialization} : ''"
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Qualification</label>
                    <input
                      type="text"
                      class="form-control"
                      name="qualification"
                      maxlength="200"
                      th:value="${doctor != null} ? ${doctor.qualification} : ''"
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Consultation Fee (₹)</label>
                    <input
                      type="number"
                      class="form-control"
                      name="fee"
                      required
                      min="0"
                      step="0.01"
                      th:value="${doctor != null} ? ${doctor.consultationFee} : ''"
                    />
                  </div>
                </div>

                <button
                  type="submit"
                  class="btn btn-primary"
                  th:text="${doctor == null} ? 'Add Doctor' : 'Save Changes'"
                ></button>
                <a th:href="@{/admin/doctors}" class="btn btn-outline-secondary"
                  >Back</a
                >
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
    <script>
      function togglePassword() {
        const input = document.getElementById("doctorPassword");
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        event.target.textContent = showing ? "👁" : "🫣";
      }
    </script>
  </body>
</html>
