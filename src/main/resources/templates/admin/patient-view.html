<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Record - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/adminnav :: nav('patients')}"></div>

    <div class="container mt-4">
      <div
        class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2"
      >
        <h3 class="mb-0">Patient Record</h3>
        <a th:href="@{/admin/patients}" class="btn btn-outline-secondary btn-sm"
          >← Back to Patients</a
        >
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h5 class="mb-1" th:text="${patient.fullName}"></h5>
          <p class="mb-1">
            📧 <span th:text="${patient.email}"></span> · 📱
            <span th:text="${patient.phone}"></span>
          </p>
          <p
            class="mb-2 text-muted small"
            th:text="'Registered: ' + ${#temporals.format(patient.createdAt, 'dd MMM yyyy, HH:mm')}"
          ></p>
          <hr />
          <!-- ?. = safe navigation: if profile is null, whole expression is null → Elvis prints '—' -->
          <div class="row small">
            <div class="col-md-3 mb-1">
              <strong>DOB:</strong>
              <span
                th:text="${profile?.dateOfBirth != null} ? ${#temporals.format(profile.dateOfBirth, 'dd MMM yyyy')} : '—'"
              ></span>
            </div>
            <div class="col-md-3 mb-1">
              <strong>Gender:</strong>
              <span th:text="${profile?.gender ?: '—'}"></span>
            </div>
            <div class="col-md-3 mb-1">
              <strong>Blood:</strong>
              <span th:text="${profile?.bloodGroup ?: '—'}"></span>
            </div>
            <div class="col-md-3 mb-1">
              <strong>Emergency:</strong>
              <span th:text="${profile?.emergencyContact ?: '—'}"></span>
            </div>
            <div class="col-12">
              <strong>Address:</strong>
              <span th:text="${profile?.address ?: '—'}"></span>
            </div>
          </div>
        </div>
      </div>

      <h5>Appointment History</h5>
      <div class="card shadow-sm mb-4">
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Doctor</th>
                <th>Status</th>
                <th>Fee</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="a : ${appointments}">
                <td
                  th:text="${#temporals.format(a.appointmentDate, 'dd MMM yyyy')}"
                ></td>
                <td th:text="${#temporals.format(a.startTime, 'HH:mm')}"></td>
                <td th:text="${a.doctor.user.fullName}"></td>
                <td>
                  <span th:switch="${a.status.name()}">
                    <span
                      class="badge text-bg-warning"
                      th:case="PENDING"
                      th:text="${a.status}"
                    ></span>
                    <span
                      class="badge text-bg-primary"
                      th:case="CONFIRMED"
                      th:text="${a.status}"
                    ></span>
                    <span
                      class="badge text-bg-secondary"
                      th:case="COMPLETED"
                      th:text="${a.status}"
                    ></span>
                    <span
                      class="badge text-bg-danger"
                      th:case="CANCELLED"
                      th:text="${a.status}"
                    ></span>
                  </span>
                </td>
                <td th:text="'₹' + ${a.fee}"></td>
              </tr>
              <tr th:if="${#lists.isEmpty(appointments)}">
                <td colspan="5" class="text-center text-muted py-3">
                  No appointments.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <h5>Prescriptions</h5>
      <div
        class="alert alert-info py-2"
        th:if="${#lists.isEmpty(prescriptions)}"
      >
        No prescriptions.
      </div>

      <div class="card shadow-sm mb-3" th:each="rx : ${prescriptions}">
        <div class="card-body">
          <div class="d-flex justify-content-between flex-wrap">
            <h6
              class="mb-1"
              th:text="${rx.appointment.doctor.user.fullName}"
            ></h6>
            <small
              class="text-muted"
              th:text="'Issued ' + ${#temporals.format(rx.createdAt, 'dd MMM yyyy, HH:mm')}"
            ></small>
          </div>
          <p class="mb-2 mt-2">
            <strong>Diagnosis:</strong> <span th:text="${rx.diagnosis}"></span>
          </p>
          <ul class="mb-0">
            <li th:each="m : ${rx.medicines}">
              <span th:text="${m.medicineName}"></span>
              <span
                class="text-muted small"
                th:if="${m.dosage}"
                th:text="' — ' + ${m.dosage}"
              ></span>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
  </body>
</html>
