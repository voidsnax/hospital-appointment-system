<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/adminnav :: nav('dashboard')}"></div>

    <div class="container mt-4">
      <h3 class="mb-4">Admin Dashboard</h3>

      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <a th:href="@{/admin/patients}" class="text-decoration-none">
            <div class="card text-bg-primary shadow-sm h-100">
              <div class="card-body">
                <h6 class="card-title">Patients</h6>
                <h2 class="mb-0" th:text="${patientCount}">0</h2>
              </div>
            </div>
          </a>
        </div>
        <div class="col-md-3">
          <a th:href="@{/admin/doctors}" class="text-decoration-none">
            <div class="card text-bg-success shadow-sm h-100">
              <div class="card-body">
                <h6 class="card-title">Doctors</h6>
                <h2 class="mb-0" th:text="${doctorCount}">0</h2>
              </div>
            </div>
          </a>
        </div>
        <div class="col-md-3">
          <a th:href="@{/admin/departments}" class="text-decoration-none">
            <div class="card text-bg-warning shadow-sm h-100">
              <div class="card-body">
                <h6 class="card-title">Departments</h6>
                <h2 class="mb-0" th:text="${departmentCount}">0</h2>
              </div>
            </div>
          </a>
        </div>
        <div class="col-md-3">
          <a th:href="@{/admin/appointments}" class="text-decoration-none">
            <div class="card text-bg-info shadow-sm h-100">
              <div class="card-body">
                <h6 class="card-title">Appointments Today</h6>
                <h2 class="mb-0" th:text="${todayAppointments}">0</h2>
              </div>
            </div>
          </a>
        </div>
      </div>

      <div class="alert alert-warning py-2" th:if="${pendingCount > 0}">
        ⏳ <strong th:text="${pendingCount}"></strong> appointment(s) awaiting
        doctor confirmation.
      </div>

      <div class="row g-3">
        <div class="col-lg-6">
          <div class="card shadow-sm">
            <div class="card-header">Appointments by Department</div>
            <div class="table-responsive">
              <table class="table mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Department</th>
                    <th>Appointments</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- GROUP BY result: each row is an Object[] — index access -->
                  <tr th:each="row : ${byDepartment}">
                    <td th:text="${row[0]}"></td>
                    <td th:text="${row[1]}"></td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(byDepartment)}">
                    <td colspan="2" class="text-center text-muted py-3">
                      No appointments yet
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card shadow-sm">
            <div class="card-header">Appointments by Status</div>
            <div class="table-responsive">
              <table class="table mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Status</th>
                    <th>Count</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="row : ${byStatus}">
                    <td th:text="${row[0]}"></td>
                    <td th:text="${row[1]}"></td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(byStatus)}">
                    <td colspan="2" class="text-center text-muted py-3">
                      No appointments yet
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
  </body>
</html>
