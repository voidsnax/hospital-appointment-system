<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointments - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/adminnav :: nav('appointments')}"></div>

    <div class="container mt-4">
      <div
        class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2"
      >
        <h3 class="mb-0">All Appointments</h3>
        <div class="btn-group flex-wrap">
          <a
            class="btn btn-sm"
            th:classappend="${status == null}?'btn-primary':'btn-outline-primary'"
            th:href="@{/admin/appointments}"
            >All</a
          >
          <a
            class="btn btn-sm"
            th:each="st : ${T(com.hospital.app.entity.AppointmentStatus).values()}"
            th:classappend="${status == st}?'btn-primary':'btn-outline-primary'"
            th:href="@{/admin/appointments(status=${st})}"
            th:text="${st}"
          ></a>
        </div>
      </div>

      <div
        class="alert alert-success"
        th:if="${success}"
        th:text="${success}"
      ></div>
      <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Patient</th>
                <th>Doctor</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="a : ${appointments}">
                <td
                  th:text="${#temporals.format(a.appointmentDate, 'dd MMM yyyy')}"
                ></td>
                <td th:text="${#temporals.format(a.startTime, 'HH:mm')}"></td>
                <td th:text="${a.patient.fullName}"></td>
                <td th:text="${a.doctor.user.fullName}"></td>
                <td>
                  <span th:switch="${a.status.name()}">
                    <span
                      class="badge text-bg-warning"
                      th:case="PENDING"
                      th:text="${a.status}"
                    ></span>
                    <span
                      class="badge text-bg-primary"
                      th:case="CONFIRMED"
                      th:text="${a.status}"
                    ></span>
                    <span
                      class="badge text-bg-secondary"
                      th:case="COMPLETED"
                      th:text="${a.status}"
                    ></span>
                    <span
                      class="badge text-bg-danger"
                      th:case="CANCELLED"
                      th:text="${a.status}"
                    ></span>
                  </span>
                </td>
                <td>
                  <form
                    th:if="${a.status.name() == 'PENDING' or a.status.name() == 'CONFIRMED'}"
                    th:action="@{/admin/appointments/cancel}"
                    method="post"
                    onsubmit="return confirm('Cancel this appointment?');"
                  >
                    <input type="hidden" name="id" th:value="${a.id}" />
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                      Cancel
                    </button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(appointments)}">
                <td colspan="6" class="text-center text-muted py-4">
                  No appointments found.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/navbar :: scripts}"></div>
  </body>
</html>
