<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="bg-light">
    <div class="row g-0 min-vh-100">
      <div th:replace="~{fragments/authpanel :: panel}"></div>

      <div
        class="col-lg-6 d-flex align-items-center justify-content-center p-4"
      >
        <div style="width: 100%; max-width: 560px">
          <a
            th:href="@{/}"
            class="text-decoration-none text-muted d-block d-lg-none mb-3"
            >← Back to home</a
          >

          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h3 class="text-center mb-1">Create Account</h3>
              <p class="text-center text-muted mb-4">Register as a patient</p>

              <div
                class="alert alert-danger py-2"
                th:if="${error}"
                th:text="${error}"
              ></div>

              <form
                th:action="@{/register}"
                th:object="${registerDto}"
                method="post"
                novalidate
              >
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Full Name</label>
                    <input
                      type="text"
                      class="form-control"
                      th:field="*{fullName}"
                      placeholder="John Doe"
                    />
                    <div
                      class="text-danger small"
                      th:if="${#fields.hasErrors('fullName')}"
                      th:errors="*{fullName}"
                    ></div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input
                      type="email"
                      class="form-control"
                      th:field="*{email}"
                      placeholder="you@example.com"
                    />
                    <div
                      class="text-danger small"
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}"
                    ></div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Phone (10 digits)</label>
                    <input
                      type="text"
                      class="form-control"
                      th:field="*{phone}"
                      placeholder="9876543210"
                    />
                    <div
                      class="text-danger small"
                      th:if="${#fields.hasErrors('phone')}"
                      th:errors="*{phone}"
                    ></div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">
                      Captcha:
                      <span
                        class="fw-bold text-primary"
                        th:text="${captchaQuestion}"
                      ></span>
                    </label>
                    <input
                      type="number"
                      class="form-control"
                      name="captchaAnswer"
                      placeholder="Your answer"
                    />
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label"
                      >Password (min 8 characters)</label
                    >
                    <input
                      type="password"
                      class="form-control"
                      th:field="*{password}"
                    />
                    <div
                      class="text-danger small"
                      th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}"
                    ></div>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input
                      type="password"
                      class="form-control"
                      th:field="*{confirmPassword}"
                    />
                    <div
                      class="text-danger small"
                      th:if="${#fields.hasErrors('confirmPassword')}"
                      th:errors="*{confirmPassword}"
                    ></div>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                  Register
                </button>
              </form>

              <p class="text-center mt-3 mb-0">
                Already have an account? <a th:href="@{/login}">Sign in</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
