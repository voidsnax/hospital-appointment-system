<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="bg-light">
    <div class="row g-0 min-vh-100">
      <div th:replace="~{fragments/authpanel :: panel}"></div>

      <div
        class="col-lg-6 d-flex align-items-center justify-content-center p-4"
      >
        <div style="width: 100%; max-width: 420px">
          <a
            th:href="@{/}"
            class="text-decoration-none text-muted d-block d-lg-none mb-3"
            >← Back to home</a
          >

          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h5 class="text-center mb-1">Reset Password</h5>
              <p class="text-center text-muted mb-3">
                We sent a 6-digit code to<br /><strong
                  th:text="${email}"
                ></strong>
              </p>

              <div
                class="alert alert-danger py-2"
                th:if="${error == 'mismatch'}"
              >
                Passwords do not match.
              </div>
              <div
                class="alert alert-danger py-2"
                th:if="${error == 'invalid'}"
              >
                Incorrect code. Please try again.
              </div>
              <div
                class="alert alert-danger py-2"
                th:if="${error == 'expired'}"
              >
                This code has expired. Please request a new one.
              </div>
              <div
                class="alert alert-danger py-2"
                th:if="${error == 'notfound'}"
              >
                No active code found. Please request a new one.
              </div>
              <div
                class="alert alert-danger py-2"
                th:if="${error == 'generic'}"
              >
                Password must be at least 8 characters.
              </div>

              <form th:action="@{/reset-password}" method="post">
                <div class="mb-3">
                  <label class="form-label">Reset Code</label>
                  <input
                    type="text"
                    class="form-control text-center"
                    name="code"
                    maxlength="6"
                    placeholder="••••••"
                    required
                    pattern="[0-9]{6}"
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">New Password (min 8 chars)</label>
                  <input
                    type="password"
                    class="form-control"
                    name="password"
                    required
                    minlength="8"
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Confirm New Password</label>
                  <input
                    type="password"
                    class="form-control"
                    name="confirmPassword"
                    required
                    minlength="8"
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  Reset Password
                </button>
              </form>

              <form th:action="@{/forgot-password}" method="post" class="mt-2">
                <button type="submit" class="btn btn-link btn-sm">
                  Resend code
                </button>
              </form>

              <p class="text-center mt-2 mb-0">
                <a th:href="@{/login}">← Back to login</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
