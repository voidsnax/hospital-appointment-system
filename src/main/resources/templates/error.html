<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
  </head>
  <body class="bg-light">
    <div
      class="d-flex flex-column align-items-center justify-content-center min-vh-100 text-center"
    >
      <h1 class="display-1 fw-bold text-danger" th:text="${status}">Error</h1>
      <h4 class="mb-3" th:switch="${status}">
        <span th:case="403">Access Denied</span>
        <span th:case="500">Something Went Wrong</span>
        <span th:case="*">Unexpected Error</span>
      </h4>
      <p
        class="text-muted mb-4"
        th:text="${error != null} ? ${error} : 'An unexpected error occurred. Please try again.'"
      ></p>
      <div class="d-flex gap-2">
        <a href="/login" class="btn btn-primary">Go to Login</a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary"
          >Go Back</a
        >
      </div>
    </div>
  </body>
</html>
