<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <link rel="stylesheet" th:href="@{/css/style.css}">
  </head>
  <body class="bg-light">
    <div class="row g-0 min-vh-100">
      <div th:replace="~{fragments/authpanel :: panel}"></div>

      <div
        class="col-lg-6 d-flex align-items-center justify-content-center p-4"
      >
        <div style="width: 100%; max-width: 420px">
          <a
            th:href="@{/}"
            class="text-decoration-none text-muted d-block d-lg-none mb-3"
            >← Back to home</a
          >

          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h3 class="text-center mb-1">Welcome Back</h3>
              <p class="text-center text-muted mb-4">Sign in to continue</p>

              <div class="alert alert-danger py-2" th:if="${param.error}">
                Invalid email or password.
              </div>
              <div class="alert alert-success py-2" th:if="${param.logout}">
                You have been logged out.
              </div>
              <div class="alert alert-success py-2" th:if="${param.verified}">
                Email verified successfully! Please log in.
              </div>
              <div class="alert alert-success py-2" th:if="${param.reset}">
                Password updated! Please log in with your new password.
              </div>

              <form th:action="@{/login}" method="post">
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                    th:value="${session.lastLoginEmail} ?: ''"
                  />
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  Sign In
                </button>
              </form>

              <div class="d-flex justify-content-between mt-3">
                <a th:href="@{/forgot-password}" class="small"
                  >Forgot password?</a
                >
                <a th:href="@{/register}" class="small">Create account →</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
