<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Hospital System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
  </head>
  <body class="bg-light">
    <div class="row g-0 min-vh-100">
      <div th:replace="~{fragments/authpanel :: panel}"></div>

      <div
        class="col-lg-6 d-flex align-items-center justify-content-center p-4"
      >
        <div style="width: 100%; max-width: 420px">
          <a
            th:href="@{/}"
            class="text-decoration-none text-muted d-block d-lg-none mb-3"
            >← Back to home</a
          >

          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h3 class="text-center mb-1">🔐</h3>
              <h5 class="text-center mb-3">Forgot Password</h5>

              <div
                class="alert alert-danger py-2"
                th:if="${error}"
                th:text="${error}"
              ></div>

              <form th:action="@{/forgot-password}" method="post">
                <div class="mb-3">
                  <label class="form-label">Enter your account email</label>
                  <input
                    type="email"
                    class="form-control"
                    name="email"
                    placeholder="you@example.com"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  Send Reset Code
                </button>
              </form>

              <p class="text-center mt-3 mb-0">
                <a th:href="@{/login}">← Back to login</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
